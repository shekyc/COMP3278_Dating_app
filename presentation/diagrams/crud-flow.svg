<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#ae8979"/></marker></defs><rect width="1600" height="900" fill="#f8f6f1"/><text x="80" y="90" font-family="Arial" font-size="18" fill="#a07869">CHEMISTRY / COMP3278</text><text x="80" y="170" font-family="Georgia" font-size="56" fill="#482d3c">Every interaction has a database operation</text><text x="90" y="300" font-family="Arial" font-size="29" fill="#be7366">CREATE</text><text x="330" y="300" font-family="Arial" font-size="29" fill="#482d3c">Profile, like, message</text><path d="M850,290 h80" stroke="#ae8979" stroke-width="3" marker-end="url(#arrow)"/><text x="970" y="300" font-family="Arial" font-size="24" fill="#61384e">INSERT + COMMIT</text><text x="90" y="425" font-family="Arial" font-size="29" fill="#be7366">READ</text><text x="330" y="425" font-family="Arial" font-size="29" fill="#482d3c">Discovery, matches, conversation</text><path d="M850,415 h80" stroke="#ae8979" stroke-width="3" marker-end="url(#arrow)"/><text x="970" y="425" font-family="Arial" font-size="24" fill="#61384e">SELECT + JOIN + ORDER BY</text><text x="90" y="550" font-family="Arial" font-size="29" fill="#be7366">UPDATE</text><text x="330" y="550" font-family="Arial" font-size="29" fill="#482d3c">Profile, interests, preferences</text><path d="M850,540 h80" stroke="#ae8979" stroke-width="3" marker-end="url(#arrow)"/><text x="970" y="550" font-family="Arial" font-size="24" fill="#61384e">UPDATE + junction replacement</text><text x="90" y="675" font-family="Arial" font-size="29" fill="#be7366">DELETE</text><text x="330" y="675" font-family="Arial" font-size="29" fill="#482d3c">Unmatch, unsave</text><path d="M850,665 h80" stroke="#ae8979" stroke-width="3" marker-end="url(#arrow)"/><text x="970" y="675" font-family="Arial" font-size="24" fill="#61384e">DELETE + foreign-key cascade</text