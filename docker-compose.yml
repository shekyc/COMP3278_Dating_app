services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: chemistry
      MYSQL_USER: chemistry
      MYSQL_PASSWORD: chemistry-local-demo
      MYSQL_ROOT_PASSWORD: chemistry-local-root
    volumes:
      - chemistry_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
  app:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: chemistry
      DB_PASSWORD: chemistry-local-demo
      DB_NAME: chemistry
      DEMO_MODE: "true"
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  chemistry_data:
