<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#ae8979"/></marker></defs><rect width="1600" height="900" fill="#f8f6f1"/><text x="80" y="90" font-family="Arial" font-size="18" fill="#a07869">CHEMISTRY / COMP3278</text><text x="80" y="170" font-family="Georgia" font-size="56" fill="#482d3c">Compatibility ranking: the important lines</text><rect x="80" y="220" width="1440" height="480" rx="12" fill="#482d3c" stroke="#dfcfc4"/><text x="115" y="275" transform="translate(0 0)" font-family="monospace" font-size="25" fill="#fff8ef"><tspan fill="#f0b79f">COUNT</tspan>(shared.interest_id) <tspan fill="#f0b79f">AS</tspan> shared_count,</text><text x="115" y="275" transform="translate(0 42)" font-family="monospace" font-size="25" fill="#fff8ef"><tspan fill="#f0b79f">ROUND</tspan>(40.0 * <tspan fill="#f0b79f">COUNT</tspan>(shared.interest_id)</text><text x="115" y="275" transform="translate(0 84)" font-family="monospace" font-size="25" fill="#fff8ef">  / <tspan fill="#f0b79f">GREATEST</tspan>(<tspan fill="#f0b79f">COUNT</tspan>(ci.interest_id),</text><text x="115" y="275" transform="translate(0 126)" font-family="monospace" font-size="25" fill="#fff8ef">    (<tspan fill="#f0b79f">SELECT</tspan> <tspan fill="#f0b79f">COUNT</tspan>(*) <tspan fill="#f0b79f">FROM</tspan> user_interests</text><text x="115" y="275" transform="translate(0 168)" font-family="monospace" font-size="25" fill="#fff8ef">     <tspan fill="#f0b79f">WHERE</tspan> user_id = me.user_id), 1), 2)</text><text x="115" y="275" transform="translate(0 210)" font-family="monospace" font-size="25" fill="#fff8ef">  <tspan fill="#f0b79f">AS</tspan> interest_points</text><text x="115" y="275" transform="translate(0 252)" font-family="monospace" font-size="25" fill="#fff8ef">...</text><text x="115" y="275" transform="translate(0 294)" font-family="monospace" font-size="25" fill="#fff8ef"><tspan fill="#f0b79f">GROUP BY</tspan> u.id, p.user_id, me.user_id, pref.user_id</text><text x="115" y="275" transform="translate(0 336)" font-family="monospace" font-size="25" fill="#fff8ef"><tspan fill="#f0b79f">ORDER BY</tspan> score <tspan fill="#f0b79f">DESC</tspan>, id <tspan fill="#f0b79f">ASC</tspan>;</text><text x="80" y="760" font-family="Arial" font-size="21" fill="#877d7f">Shortened for explanation. Full executable query: sql/A-ranking.sql</text><text x="80" y="850" font-family="Arial" font-size="16" fill="#9b847a">Fictional local demonstration • Source: implemented MySQL schema and repository</text></svg>