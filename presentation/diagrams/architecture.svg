<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#ae8979"/></marker></defs><rect width="1600" height="900" fill="#f8f6f1"/><text x="80" y="90" font-family="Arial" font-size="18" fill="#a07869">CHEMISTRY / COMP3278</text><text x="80" y="170" font-family="Georgia" font-size="56" fill="#482d3c">A simple local architecture</text><rect x="80" y="320" width="360" height="190" rx="12" fill="#fffaf3" stroke="#dfcfc4"/><text x="115" y="385" font-family="Arial" font-size="32" fill="#482d3c">React interface</text><text x="115" y="435" font-family="Arial" font-size="23" fill="#877d7f">Profiles, discovery and chat</text><path d="M460,415 h100" stroke="#ae8979" stroke-width="3" marker-end="url(#arrow)"/><rect x="580" y="320" width="360" height="190" rx="12" fill="#fffaf3" stroke="#dfcfc4"/><text x="615" y="385" font-family="Arial" font-size="32" fill="#482d3c">Express API</text><text x="615" y="435" font-family="Arial" font-size="23" fill="#877d7f">Validation and transactions</text><path d="M960,415 h100" stroke="#ae8979" stroke-width="3" marker-end="url(#arrow)"/><rect x="1080" y="320" width="440" height="190" rx="12" fill="#fffaf3" stroke="#dfcfc4"/><text x="1115" y="385" font-family="Arial" font-size="32" fill="#482d3c">MySQL database</text><text x="1115" y="435" font-family="Arial" font-size="23" fill="#877d7f">Ten relational tables</text><text x="80" y="625" font-family="Arial" font-size="30" fill="#482d3c">SQL results return through the API and update the interface.</text><text x="80" y="680" font-family="Arial" font-size="24" fill="#877d7f">No cloud dependency, external authentication or realtime infrastructure.</text><text x="80" y="850" font-family="Arial" font-size="16" fill="#9b847a">Fictional local demonstration • Source: implemented MySQL schema and repository</text></svg>