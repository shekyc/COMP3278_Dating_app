<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#ae8979"/></marker></defs><rect width="1600" height="900" fill="#f8f6f1"/><text x="80" y="90" font-family="Arial" font-size="18" fill="#a07869">CHEMISTRY / COMP3278</text><text x="80" y="170" font-family="Georgia" font-size="56" fill="#482d3c">Two directions create one match</text><rect x="80" y="220" width="1440" height="480" rx="12" fill="#482d3c" stroke="#dfcfc4"/><text x="115" y="275" transform="translate(0 0)" font-family="monospace" font-size="25" fill="#fff8ef"><tspan fill="#f0b79f">SELECT</tspan> 1 <tspan fill="#f0b79f">FROM</tspan> likes a</text><text x="115" y="275" transform="translate(0 42)" font-family="monospace" font-size="25" fill="#fff8ef"><tspan fill="#f0b79f">JOIN</tspan> likes b</text><text x="115" y="275" transform="translate(0 84)" font-family="monospace" font-size="25" fill="#fff8ef">  <tspan fill="#f0b79f">ON</tspan> a.from_user = b.to_user</text><text x="115" y="275" transform="translate(0 126)" font-family="monospace" font-size="25" fill="#fff8ef"> <tspan fill="#f0b79f">AND</tspan> a.to_user = b.from_user</text><text x="115" y="275" transform="translate(0 168)" font-family="monospace" font-size="25" fill="#fff8ef"><tspan fill="#f0b79f">WHERE</tspan> a.from_user = ? <tspan fill="#f0b79f">AND</tspan> a.to_user = ?;</text><text x="115" y="275" transform="translate(0 210)" font-family="monospace" font-size="25" fill="#fff8ef"></text><text x="115" y="275" transform="translate(0 252)" font-family="monospace" font-size="25" fill="#fff8ef"><tspan fill="#f0b79f">INSERT</tspan> <tspan fill="#f0b79f">INTO</tspan> matches (user_a, user_b)</text><text x="115" y="275" transform="translate(0 294)" font-family="monospace" font-size="25" fill="#fff8ef"><tspan fill="#f0b79f">VALUES</tspan> (?, ?);</text><text x="80" y="760" font-family="Arial" font-size="21" fill="#877d7f">The API inserts only after the SELECT finds a reverse like. UNIQUE(user_a,user_b) prevents duplicates.</text><text x="80" y="850" font-family="Arial" font-size="16" fill="#9b847a">Fictional local demonstration • Source: implemented MySQL schema and repository</text></svg>